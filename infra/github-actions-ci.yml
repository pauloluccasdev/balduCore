name: BalduCore checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.7-bookworm
        env:
          POSTGRES_USER: balducore
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: balducore
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U balducore -d balducore"
          --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-17
      - run: echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: PGPASSWORD=local_dev_only psql -h 127.0.0.1 -U balducore -d postgres -c 'CREATE DATABASE balducore_test'
      - run: pnpm db:deploy
      - run: pnpm db:test:deploy
      - run: pnpm test:integration
      - run: RECOVERY_ADMIN_URL=postgresql://balducore:local_dev_only@127.0.0.1:5432/postgres pnpm db:recovery:drill
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:demo
      - run: pnpm test:e2e:activities
      - run: pnpm test:e2e:monitoring
      - run: pnpm test:e2e:dashboard
# Não publicar traces/relatórios: podem conter cookies e capabilities de teste.
